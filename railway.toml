# Railway config-as-code: one file = one service. This repo uses TWO services from the same GitHub repo:
#
#   1) marbles-web  → In Railway dashboard set this service’s config file to:
#                      `railway/marbles-web.toml`
#      Variables: RELEASE_NAME=web, RELEASE_ROLE=web, DATABASE_PATH=/app/data/marbles_prod.db,
#      SECRET_KEY_BASE, ASSETS_BASE_URL, S3_*, PHX_HOST (see .env.example).
#
#   2) marbles-bot  → Config file:
#                      `railway/marbles-bot.toml`
#      Variables: RELEASE_NAME=bot, RELEASE_ROLE=bot, same DATABASE_PATH + volume as web,
#      DISCORD_BOT_TOKEN, ASSETS_BASE_URL, S3_*.
#
# This root `railway.toml` mirrors the WEB service so a default “deploy repo” still works;
# for split production, prefer binding each service to `railway/marbles-*.toml` as above.
#
# Docker must receive build-arg RELEASE_NAME (set as a Railway variable with the same name).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
sleepApplication = false
# healthcheckPath = "/"
# healthcheckTimeout = 30
requiredMountPath = "/app/data"
