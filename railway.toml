# Railway deploy strategy (single service, SQLite on mounted volume):
#
# - This file is the default production config for running ONE Railway service.
# - Use RELEASE_NAME=marbles_umbrella.
# - Persist SQLite at /app/data via DATABASE_PATH=/app/data/marbles_prod.db.
# - docker-entrypoint.sh runs migrate+seed after the volume is mounted, then starts the app.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
sleepApplication = false
requiredMountPath = "/app/data"
