# Discord bot release (Docker build arg RELEASE_NAME=bot). No HTTP server.
# Railway: second service from same repo → point config path here.
#
# Required variables:
#   RELEASE_NAME=bot
#   RELEASE_ROLE=bot
#   DISCORD_BOT_TOKEN
#   DATABASE_PATH=/app/data/marbles_prod.db   (same path as web if sharing SQLite)
#   ASSETS_BASE_URL, S3_* (same R2 config as web)
#
# Do NOT set healthcheckPath (nothing listens on PORT).
# Mount the same volume on /app/data as the web service so both use one SQLite file.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
sleepApplication = false
numReplicas = 1
requiredMountPath = "/app/data"
