# Phoenix-only release (Docker build arg RELEASE_NAME=web).
# Railway: Service → Settings → Config-as-code path → this file.
#
# Required variables (service → Variables):
#   RELEASE_NAME=web          (passed as Docker ARG; must match Dockerfile)
#   RELEASE_ROLE=web
#   DATABASE_PATH=/app/data/marbles_prod.db
#   SECRET_KEY_BASE, ASSETS_BASE_URL, S3_HOST, S3_ACCESS_KEY, S3_SECRET_KEY, …
#   PHX_HOST or RAILWAY_PUBLIC_DOMAIN for generated URLs
#
# Mount a volume on /app/data (same volume ID as the bot service if both use one DB file).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
sleepApplication = true
healthcheckPath = "/"
healthcheckTimeout = 30
requiredMountPath = "/app/data"
