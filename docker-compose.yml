# Local / optional parity with Railway: Phoenix (web) + Discord (bot), shared SQLite volume.
# Copy .env.example → .env and set secrets (R2, Discord, SECRET_KEY_BASE, etc.).
services:
  marbles-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RELEASE_NAME: web
    restart: unless-stopped
    env_file: .env
    environment:
      MIX_ENV: prod
      RELEASE_NAME: web
      RELEASE_ROLE: web
      DATABASE_PATH: /app/data/marbles_prod.db
      PORT: "4000"
    volumes:
      - marbles_sqlite:/app/data
    ports:
      - "4000:4000"

  marbles-bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RELEASE_NAME: bot
    restart: unless-stopped
    env_file: .env
    environment:
      MIX_ENV: prod
      RELEASE_NAME: bot
      RELEASE_ROLE: bot
      DATABASE_PATH: /app/data/marbles_prod.db
    volumes:
      - marbles_sqlite:/app/data

volumes:
  marbles_sqlite:
