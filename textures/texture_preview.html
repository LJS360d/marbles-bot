<!doctype html>
<!-- http://0.0.0.0:8000/texture_preview.html -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Marbles Triplanar Preview</title>
        <style>
            :root {
                color-scheme: dark;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                background: #0a0d14;
                color: #d7dbe8;
                font-family:
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    sans-serif;
            }
            #ui {
                position: fixed;
                inset: 12px auto auto 12px;
                width: 320px;
                background: rgba(13, 18, 30, 0.9);
                border: 1px solid rgba(148, 163, 184, 0.25);
                border-radius: 12px;
                padding: 12px;
                backdrop-filter: blur(8px);
                z-index: 10;
            }
            #ui h1 {
                margin: 0 0 8px;
                font-size: 14px;
                font-weight: 600;
            }
            #ui p {
                margin: 0 0 8px;
                font-size: 12px;
                color: #a9b2c8;
            }
            #names {
                width: 100%;
                height: 150px;
                resize: vertical;
                background: #060910;
                color: #d7dbe8;
                border: 1px solid rgba(148, 163, 184, 0.25);
                border-radius: 8px;
                padding: 8px;
                font:
                    12px/1.4 ui-monospace,
                    SFMono-Regular,
                    Menlo,
                    monospace;
            }
            #actions {
                margin-top: 8px;
                display: flex;
                gap: 8px;
            }
            button {
                appearance: none;
                border: 1px solid rgba(148, 163, 184, 0.3);
                background: #1b2236;
                color: #f4f7ff;
                border-radius: 8px;
                padding: 8px 10px;
                font-size: 12px;
                cursor: pointer;
            }
            button:hover {
                background: #25304d;
            }
            #status {
                margin-top: 8px;
                font-size: 12px;
                color: #9fb1d9;
                white-space: pre-wrap;
            }
            canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div id="ui">
            <h1>Marble Sphere Preview</h1>
            <p>
                One marble name per line. Uses the same sphere render path as
                <code>gacha_page_hook.js</code>. Also supports single-face atlas textures (2:1 width)
                generated by <code>--single-face-features</code>.
            </p>
            <textarea id="names">
cool-moody
            </textarea>
            <div id="actions">
                <button id="reload">Reload Marbles</button>
            </div>
            <div id="status">Ready.</div>
        </div>

        <script type="module">
            import * as THREE from "https://unpkg.com/three@0.165.0/build/three.module.js";

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x080b12);

            const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(0, 4.8, 12.5);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            const hemisphere = new THREE.HemisphereLight(0xbecfff, 0x080a10, 0.9);
            scene.add(hemisphere);

            const directional = new THREE.DirectionalLight(0xffffff, 1.1);
            directional.position.set(3.2, 5.5, 4.5);
            scene.add(directional);

            const fill = new THREE.DirectionalLight(0xaac7ff, 0.45);
            fill.position.set(-6.0, 1.8, -3.0);
            scene.add(fill);

            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(200, 200),
                new THREE.MeshStandardMaterial({ color: 0x0b101a, roughness: 0.95, metalness: 0.0 }),
            );
            floor.rotation.x = -Math.PI * 0.5;
            floor.position.y = -1.4;
            scene.add(floor);

            const marbleGroup = new THREE.Group();
            scene.add(marbleGroup);

            const loader = new THREE.TextureLoader();
            const statusEl = document.getElementById("status");
            const namesEl = document.getElementById("names");
            const reloadBtn = document.getElementById("reload");
            const textureCache = new Map();
            const mappedTextureCache = new Map();

            function configureMarbleTexture(texture) {
                texture.colorSpace = THREE.SRGBColorSpace;
                texture.flipY = true;
                texture.wrapS = THREE.ClampToEdgeWrapping;
                texture.wrapT = THREE.ClampToEdgeWrapping;
                texture.minFilter = THREE.LinearMipmapLinearFilter;
                texture.magFilter = THREE.LinearFilter;
                texture.generateMipmaps = true;
            }

            function isAtlasTexture(texture) {
                const w = texture?.image?.width || 0;
                const h = texture?.image?.height || 0;
                return h > 0 && w >= h * 1.9;
            }

            function atlasToEquirect(texture, cacheKey) {
                const hit = mappedTextureCache.get(cacheKey);
                if (hit) return hit;

                const srcImage = texture?.image;
                const sw = srcImage?.width || 0;
                const sh = srcImage?.height || 0;
                if (sw <= 0 || sh <= 0) return texture;

                const srcCanvas = document.createElement("canvas");
                srcCanvas.width = sw;
                srcCanvas.height = sh;
                const srcCtx = srcCanvas.getContext("2d", { willReadFrequently: true });
                srcCtx.drawImage(srcImage, 0, 0, sw, sh);
                const srcData = srcCtx.getImageData(0, 0, sw, sh).data;

                const outCanvas = document.createElement("canvas");
                outCanvas.width = sw;
                outCanvas.height = sh;
                const outCtx = outCanvas.getContext("2d");
                const outImage = outCtx.createImageData(sw, sh);
                const out = outImage.data;

                const r = sh * 0.5;
                const safeR = Math.max(2, r - 4);
                const cy = sh * 0.5;
                const frontCx = sw * 0.25;
                const backCx = sw * 0.75;

                const sample = (sx, sy) => {
                    const ix = Math.max(0, Math.min(sw - 1, Math.round(sx)));
                    const iy = Math.max(0, Math.min(sh - 1, Math.round(sy)));
                    const i = (iy * sw + ix) * 4;
                    return [srcData[i], srcData[i + 1], srcData[i + 2], srcData[i + 3]];
                };

                for (let y = 0; y < sh; y += 1) {
                    const v = (y + 0.5) / sh;
                    const lat = (0.5 - v) * Math.PI;
                    const sinLat = Math.sin(lat);
                    const cosLat = Math.cos(lat);

                    for (let x = 0; x < sw; x += 1) {
                        const u = (x + 0.5) / sw;
                        const lon = (u - 0.5) * Math.PI * 2.0;
                        const nx = Math.sin(lon) * cosLat;
                        const ny = sinLat;
                        const nz = Math.cos(lon) * cosLat;

                        let cx = frontCx;
                        let localX = nx;
                        if (nz < 0.0) {
                            cx = backCx;
                            localX = -nx;
                        }

                        let sx = cx + localX * safeR;
                        let sy = cy - ny * safeR;
                        let dx = sx - cx;
                        let dy = sy - cy;
                        const d2 = dx * dx + dy * dy;
                        const di = (y * sw + x) * 4;

                        if (d2 > safeR * safeR) {
                            const invLen = 1.0 / Math.sqrt(d2);
                            dx = dx * invLen * safeR;
                            dy = dy * invLen * safeR;
                            sx = cx + dx;
                            sy = cy + dy;
                        }

                        let [pr, pg, pb, pa] = sample(sx, sy);
                        if (pa < 32) {
                            const sx2 = cx + localX * Math.max(1, safeR - 8);
                            const sy2 = cy - ny * Math.max(1, safeR - 8);
                            [pr, pg, pb, pa] = sample(sx2, sy2);
                        }
                        out[di + 0] = pr;
                        out[di + 1] = pg;
                        out[di + 2] = pb;
                        out[di + 3] = 255;
                    }
                }

                const seamBand = Math.max(4, Math.floor(sw / 256));
                for (let y = 0; y < sh; y += 1) {
                    const i0 = (y * sw + 0) * 4;
                    const i1 = (y * sw + (sw - 1)) * 4;
                    const avg = [
                        ((out[i0 + 0] + out[i1 + 0]) * 0.5) | 0,
                        ((out[i0 + 1] + out[i1 + 1]) * 0.5) | 0,
                        ((out[i0 + 2] + out[i1 + 2]) * 0.5) | 0,
                        ((out[i0 + 3] + out[i1 + 3]) * 0.5) | 0,
                    ];
                    for (let k = 0; k < 4; k += 1) {
                        out[i0 + k] = avg[k];
                        out[i1 + k] = avg[k];
                    }

                    for (let b = 1; b <= seamBand; b += 1) {
                        const t = b / (seamBand + 1);
                        const il = (y * sw + b) * 4;
                        const ir = (y * sw + (sw - 1 - b)) * 4;
                        for (let k = 0; k < 4; k += 1) {
                            out[il + k] = (out[il + k] * (1 - t) + avg[k] * t) | 0;
                            out[ir + k] = (out[ir + k] * (1 - t) + avg[k] * t) | 0;
                        }
                    }
                }

                outCtx.putImageData(outImage, 0, 0);
                const mapped = new THREE.CanvasTexture(outCanvas);
                configureMarbleTexture(mapped);
                mapped.wrapS = THREE.RepeatWrapping;
                mapped.wrapT = THREE.ClampToEdgeWrapping;
                mappedTextureCache.set(cacheKey, mapped);
                return mapped;
            }

            function buildMarbleMaterial(texture, texturePath) {
                if (isAtlasTexture(texture)) {
                    const mapped = atlasToEquirect(texture, texturePath);
                    return new THREE.MeshBasicMaterial({
                        map: mapped,
                        color: 0xffffff,
                        transparent: false,
                    });
                }
                return new THREE.MeshBasicMaterial({
                    map: texture,
                    color: 0xffffff,
                    transparent: true,
                });
            }

            function fallbackMarbleMaterial() {
                return new THREE.MeshStandardMaterial({
                    color: 0xd1d5db,
                    metalness: 0.5,
                    roughness: 0.35,
                    emissive: 0xd1d5db,
                    emissiveIntensity: 0.14,
                });
            }

            function marbleNamesFromInput() {
                return namesEl.value
                    .split("\n")
                    .map((v) => v.trim())
                    .filter(Boolean);
            }

            function clearMarbles() {
                while (marbleGroup.children.length > 0) {
                    const item = marbleGroup.children.pop();
                    if (!item) continue;
                    scene.remove(item);
                    item.geometry?.dispose();
                    item.material?.dispose();
                }
            }

            function loadTexture(path) {
                return new Promise((resolve, reject) => {
                    loader.load(path, resolve, undefined, reject);
                });
            }

            async function loadMarbles() {
                clearMarbles();
                for (const tex of textureCache.values()) tex.dispose();
                textureCache.clear();
                for (const tex of mappedTextureCache.values()) tex.dispose();
                mappedTextureCache.clear();
                const names = marbleNamesFromInput();
                const columns = Math.max(1, Math.ceil(Math.sqrt(names.length)));
                const spacing = 2.2;
                let loaded = 0;
                let failed = 0;
                const failures = [];
                let singleFaceLoaded = 0;

                statusEl.textContent = "Loading textures...";

                await Promise.all(
                    names.map(async (name, index) => {
                        try {
                            const texturePath = `./.rclone/marbles/${name}/standard/texture.webp`;
                            const textureBasePath = `./.rclone/marbles/${name}/standard/texture_base.webp`;
                            const geometry = new THREE.SphereGeometry(0.85, 40, 40);
                            const material = fallbackMarbleMaterial();
                            const mesh = new THREE.Mesh(geometry, material);
                            const x = (index % columns) * spacing - ((columns - 1) * spacing) / 2;
                            const z =
                                Math.floor(index / columns) * spacing -
                                ((Math.ceil(names.length / columns) - 1) * spacing) / 2;
                            mesh.position.set(x, 0, z);
                            marbleGroup.add(mesh);

                            let tex = textureCache.get(texturePath) || null;
                            if (!tex) {
                                try {
                                    tex = await loadTexture(texturePath);
                                } catch {
                                    tex = await loadTexture(textureBasePath);
                                }
                                configureMarbleTexture(tex);
                                textureCache.set(texturePath, tex);
                            }
                            if (tex?.image?.width >= tex?.image?.height * 1.9) {
                                singleFaceLoaded += 1;
                            }
                            const prev = mesh.material;
                            mesh.material = buildMarbleMaterial(tex, texturePath);
                            prev?.dispose?.();
                            loaded += 1;
                        } catch {
                            failed += 1;
                            failures.push(name);
                        }
                    }),
                );

                if (failed > 0) {
                    statusEl.textContent =
                        `Loaded: ${loaded}, failed: ${failed}, single-face: ${singleFaceLoaded}` +
                        `\nMissing: ${failures.join(", ")}`;
                } else {
                    statusEl.textContent = `Loaded: ${loaded}, failed: 0, single-face: ${singleFaceLoaded}`;
                }
            }

            reloadBtn.addEventListener("click", () => {
                loadMarbles();
            });

            window.addEventListener("resize", () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                const t = clock.getElapsedTime();
                marbleGroup.rotation.y = t * 0.15;
                marbleGroup.children.forEach((mesh, i) => {
                    mesh.rotation.y = t * 0.45 + i * 0.23;
                    mesh.rotation.x = Math.sin(t * 0.9 + i * 0.4) * 0.08;
                });
                renderer.render(scene, camera);
            }

            loadMarbles();
            animate();
        </script>
    </body>
</html>
